<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buy Me</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#14171a; --sub:#6b7280; --line:#e5e7eb;
  --accent:#16a34a; --accent-d:#15803d; --danger:#dc2626; --warn:#d97706; --chip:#eef2ff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --card:#181b21; --text:#f1f3f5; --sub:#9aa3af; --line:#2a2e37;
    --accent:#22c55e; --accent-d:#16a34a; --danger:#f87171; --warn:#fbbf24; --chip:#1c2333;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#181b21; --text:#f1f3f5; --sub:#9aa3af; --line:#2a2e37;
  --accent:#22c55e; --accent-d:#16a34a; --danger:#f87171; --warn:#fbbf24; --chip:#1c2333;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{height:100%; margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.topbar{position:sticky; top:0; padding-top:calc(env(safe-area-inset-top,0px) + 10px); background:var(--card); border-bottom:1px solid var(--line); z-index:20;}
.tabbar{position:sticky; bottom:0; padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px); background:var(--card); border-top:1px solid var(--line); z-index:20;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px;}
.tile{background:var(--card); border:1px solid var(--line); border-radius:16px; transition:.1s; position:relative;}
.tile:active{transform:scale(.96); background:var(--chip);}
.chip{background:var(--chip); color:var(--accent-d);}
.scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.sheet{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top-left-radius:20px; border-top-right-radius:20px; box-shadow:0 -6px 30px rgba(0,0,0,.2); padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px); z-index:50; max-height:88vh; overflow-y:auto;}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40;}
input,select,textarea{background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:10px;}
button{font-family:inherit;}
.badge{position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; border-radius:9999px; font-size:10px; min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 3px;}
::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app" style="max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;"></div>

<script>
// ---------- Claude runtime capabilities ----------
let sampleAPI=null, downloadsAPI=null, sampleImgLimits=null;
(async()=>{
  try{ if(window.claude){ sampleAPI = await window.claude.use('sample'); downloadsAPI = await window.claude.use('downloads');
    if(sampleAPI){ try{ sampleImgLimits = await sampleAPI.limits(); }catch(e){} } } }catch(e){}
})();

// ---------- storage ----------
const LS_CATALOG='buyme_catalog', LS_SETTINGS='buyme_settings', LS_TXNS='buyme_txns', LS_CUSTOMERS='buyme_customers';

function loadCatalog(){
  try{ const v=localStorage.getItem(LS_CATALOG); if(v) return JSON.parse(v); }catch(e){}
  const seed=[
    {id:'oil',name:'Coconut Oil',icon:'🥥',unit:'pcs',variants:[{name:'Standard',price:180}],stock:20,lowStock:5},
    {id:'rice',name:'Rice',icon:'🍚',unit:'kg',variants:[{name:'Basmati',price:90},{name:'Sona Masuri',price:55}],stock:40,lowStock:8},
    {id:'sugar',name:'Sugar',icon:'🍬',unit:'kg',variants:[{name:'Standard',price:45}],stock:30,lowStock:6},
    {id:'onion',name:'Onion',icon:'🧅',unit:'kg',variants:[{name:'Standard',price:35}],stock:3,lowStock:5},
    {id:'tea',name:'Tea',icon:'☕',unit:'pcs',variants:[{name:'Cup',price:15}],stock:null,lowStock:null},
    {id:'notebook',name:'Notebook',icon:'📓',unit:'pcs',variants:[{name:'200pg',price:35},{name:'100pg',price:20}],stock:15,lowStock:5},
    {id:'pen',name:'Pen',icon:'🖊️',unit:'pcs',variants:[{name:'Standard',price:10}],stock:50,lowStock:10},
    {id:'flour',name:'Flour',icon:'🌾',unit:'kg',variants:[{name:'Standard',price:42}],stock:null,lowStock:null},
  ];
  localStorage.setItem(LS_CATALOG, JSON.stringify(seed));
  return seed;
}
function saveCatalog(c){ localStorage.setItem(LS_CATALOG, JSON.stringify(c)); }
function loadSettings(){
  try{ const v=localStorage.getItem(LS_SETTINGS); if(v) return {...defaultSettings(), ...JSON.parse(v)}; }catch(e){}
  const s=defaultSettings(); localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); return s;
}
function defaultSettings(){ return {shopName:'My Shop', phone:'', theme:'system',
  paymentProfiles:[{label:'Primary UPI', upiId:''}], defaultProfile:0,
  gstEnabled:false, gstin:'', gstRate:5, invoiceCounter:1 }; }
function saveSettings(s){ localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); }
function loadTxns(){ try{ const v=localStorage.getItem(LS_TXNS); if(v) return JSON.parse(v); }catch(e){} return []; }
function saveTxns(t){ localStorage.setItem(LS_TXNS, JSON.stringify(t)); }
function loadCustomers(){ try{ const v=localStorage.getItem(LS_CUSTOMERS); if(v) return JSON.parse(v); }catch(e){} return []; }
function saveCustomers(c){ localStorage.setItem(LS_CUSTOMERS, JSON.stringify(c)); }

let catalog = loadCatalog();
let settings = loadSettings();
let txns = loadTxns();
let customers = loadCustomers();
let cart = [];
let tab = 'bill';
let searchQ = '';

function applyTheme(){ document.documentElement.setAttribute('data-theme', settings.theme==='system' ? '' : settings.theme); }
applyTheme();

function lowStockItems(){ return catalog.filter(i=> i.stock!=null && i.lowStock!=null && i.stock<=i.lowStock); }
function trendingItems(){
  const since = Date.now()-7*24*3600*1000;
  const tally={};
  txns.filter(t=>t.ts>=since).forEach(t=>t.items.forEach(l=>{ tally[l.name]=(tally[l.name]||0)+l.qty; }));
  return Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,3);
}
function notifCount(){ return lowStockItems().length; }

const app = document.getElementById('app');
function render(){
  app.innerHTML = `
    <div class="topbar px-4 py-3 flex items-center justify-between">
      <div>
        <div class="font-bold text-lg">🧮 Buy Me</div>
        <div style="color:var(--sub)" class="text-xs">${esc(settings.shopName||'My Shop')}</div>
      </div>
      <div class="flex items-center gap-2">
        <button id="bellBtn" class="chip rounded-full relative" style="width:38px;height:38px;font-size:18px;">🔔
          ${notifCount()>0?`<span class="badge">${notifCount()}</span>`:''}
        </button>
        <div class="chip px-3 py-1 rounded-full text-sm font-semibold">🛒 ${cart.length}</div>
      </div>
    </div>
    <div id="content" class="flex-1 px-4 py-3" style="padding-bottom:90px;"></div>
    <div class="tabbar grid grid-cols-4 text-center text-xs">
      ${tabBtn('bill','🧾','Billing')}
      ${tabBtn('catalog','📦','Catalog')}
      ${tabBtn('insights','📊','Insights')}
      ${tabBtn('settings','⚙️','Settings')}
    </div>
  `;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab; render();});
  document.getElementById('bellBtn').onclick=openNotifPanel;
  const content = document.getElementById('content');
  if(tab==='bill') renderBilling(content);
  if(tab==='catalog') renderCatalog(content);
  if(tab==='insights') renderInsights(content);
  if(tab==='settings') renderSettings(content);
}
function tabBtn(id,icon,label){
  const active = tab===id;
  return `<button data-tab="${id}" class="py-2" style="color:${active?'var(--accent)':'var(--sub)'};font-weight:${active?'700':'500'}">
    <div style="font-size:18px">${icon}</div><div>${label}</div></button>`;
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function openSheet(html){
  const overlay=document.createElement('div'); overlay.className='overlay';
  const sheet=document.createElement('div'); sheet.className='sheet p-5';
  sheet.innerHTML=html;
  document.body.appendChild(overlay); document.body.appendChild(sheet);
  const close=()=>{overlay.remove(); sheet.remove();};
  overlay.onclick=close;
  return {sheet, close};
}

// ---------- Notifications ----------
function openNotifPanel(){
  const low = lowStockItems();
  const trend = trendingItems();
  const {sheet, close} = openSheet(`
    <div class="font-bold text-lg mb-3">🔔 Notifications</div>
    <div class="font-semibold text-sm mb-1">Low stock</div>
    ${low.length? low.map(i=>`<div class="text-sm mb-1" style="color:var(--danger)">⚠️ ${i.icon} ${esc(i.name)} — only ${i.stock} ${i.unit} left</div>`).join('') : `<div class="text-sm mb-3" style="color:var(--sub)">All stocked items are healthy</div>`}
    <div class="font-semibold text-sm mt-4 mb-1">Trending this week</div>
    ${trend.length? trend.map(([n,q])=>`<div class="text-sm mb-1">🔥 ${esc(n)} — ${q} sold</div>`).join('') : `<div class="text-sm mb-3" style="color:var(--sub)">No sales recorded yet</div>`}
    <button id="broadcastBtn" class="w-full py-3 rounded-xl font-bold text-white mt-4" style="background:var(--accent)">📣 Send offer to customers (WhatsApp)</button>
    <button id="closeN" class="w-full py-2 mt-2 text-sm" style="color:var(--sub)">Close</button>
  `);
  sheet.querySelector('#closeN').onclick=close;
  sheet.querySelector('#broadcastBtn').onclick=()=>{close(); openBroadcastPanel();};
}
function openBroadcastPanel(){
  let msg='';
  const {sheet, close} = openSheet(`
    <div class="font-bold text-lg mb-3">📣 Broadcast to customers</div>
    <textarea id="msgBox" rows="3" class="w-full px-3 py-2 mb-3" placeholder="e.g. New stock of Basmati Rice just arrived! Visit us today."></textarea>
    <div style="color:var(--sub)" class="text-xs mb-2">Opens WhatsApp with this message pre-filled for each saved customer — you tap Send in WhatsApp for each one (no auto-send).</div>
    <div id="custList" class="mb-3"></div>
    <button id="addCust" class="text-sm chip px-3 py-1 rounded-full mb-3">+ Add customer number</button>
    <button id="closeB" class="w-full py-2 text-sm" style="color:var(--sub)">Close</button>
  `);
  function drawList(){
    sheet.querySelector('#custList').innerHTML = customers.length? customers.map((c,i)=>`
      <div class="flex items-center justify-between py-2 card px-3 mb-2">
        <div class="text-sm">${esc(c.name||c.phone)} <span style="color:var(--sub)">(${esc(c.phone)})</span></div>
        <div class="flex gap-2">
          <button data-send="${i}" class="chip px-2 py-1 rounded-full text-xs">Send</button>
          <button data-delc="${i}" style="color:var(--danger)">✕</button>
        </div>
      </div>`).join('') : `<div style="color:var(--sub)" class="text-sm">No saved customers yet.</div>`;
    sheet.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>{
      const c = customers[+b.dataset.send];
      const text = encodeURIComponent(sheet.querySelector('#msgBox').value||'');
      window.open(`https://wa.me/${c.phone}?text=${text}`,'_blank');
    });
    sheet.querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>{ customers.splice(+b.dataset.delc,1); saveCustomers(customers); drawList(); });
  }
  drawList();
  sheet.querySelector('#addCust').onclick=()=>{
    const phone = prompt('Customer WhatsApp number (with country code, digits only):');
    if(phone){ const name = prompt('Name (optional):')||''; customers.push({name, phone: phone.replace(/\D/g,'')}); saveCustomers(customers); drawList(); }
  };
  sheet.querySelector('#closeB').onclick=close;
}

// ---------- Billing tab ----------
function renderBilling(el){
  const total = cart.reduce((s,l)=>s+l.qty*l.price,0);
  const filtered = catalog.filter(it=> it.name.toLowerCase().includes(searchQ.toLowerCase()));
  el.innerHTML = `
    <div class="flex gap-2 mb-3">
      <input id="searchBox" value="${esc(searchQ)}" placeholder="🔍 Search items..." class="flex-1 px-3 py-2 text-sm" />
      <button id="scanBtn" class="chip rounded-xl px-3" title="Scan a photo of a shopping list">📷</button>
    </div>
    <input id="fileInput" type="file" accept="image/*" style="display:none" />
    <div class="grid grid-cols-3 gap-3 mb-4">
      ${filtered.map(it=>`
        <button class="tile p-3 text-center" data-item="${it.id}">
          ${it.stock!=null && it.lowStock!=null && it.stock<=it.lowStock? `<span class="badge">!</span>`:''}
          <div style="font-size:28px">${it.icon||'🛒'}</div>
          <div class="text-sm font-semibold mt-1">${esc(it.name)}</div>
          <div style="color:var(--sub)" class="text-xs">${it.variants.length>1? it.variants.length+' options' : '₹'+it.variants[0].price+'/'+it.unit}</div>
        </button>`).join('')}
      ${filtered.length===0? `<div class="col-span-3 text-center py-6" style="color:var(--sub)">No items match "${esc(searchQ)}"</div>`:''}
    </div>
    ${cart.length? `
    <div class="card p-3 mb-3">
      <div class="font-semibold mb-2">Current Bill</div>
      ${cart.map((l,i)=>`
        <div class="flex items-center justify-between py-2" style="border-top:${i>0?'1px solid var(--line)':'none'}">
          <div>
            <div class="text-sm font-medium">${l.icon} ${esc(l.name)} <span style="color:var(--sub)">(${esc(l.variant)})</span></div>
            <div style="color:var(--sub)" class="text-xs">${l.qty} ${l.unit} × ₹${l.price}</div>
          </div>
          <div class="flex items-center gap-3">
            <div class="font-semibold">₹${(l.qty*l.price).toFixed(2)}</div>
            <button data-rm="${i}" style="color:var(--danger)">✕</button>
          </div>
        </div>`).join('')}
      <div class="flex items-center justify-between pt-3 mt-2" style="border-top:2px solid var(--line)">
        <div class="font-bold text-lg">Total</div>
        <div class="font-bold text-lg" style="color:var(--accent)">₹${total.toFixed(2)}</div>
      </div>
    </div>
    <button id="genBill" class="w-full py-3 rounded-xl font-bold text-white" style="background:var(--accent)">Generate Bill 🧾</button>
    <button id="clearCart" class="w-full py-2 mt-2 text-sm" style="color:var(--danger)">Clear bill</button>
    `: `<div class="text-center py-10" style="color:var(--sub)">Search or tap an item above to start billing</div>`}
  `;
  el.querySelector('#searchBox').oninput=(e)=>{searchQ=e.target.value; renderBilling(el);};
  el.querySelector('#searchBox').focus();
  el.querySelector('#searchBox').selectionStart = el.querySelector('#searchBox').value.length;
  el.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>openQtySheet(b.dataset.item));
  const gb = document.getElementById('genBill'); if(gb) gb.onclick=generateBill;
  const cc = document.getElementById('clearCart'); if(cc) cc.onclick=()=>{cart=[];render();};
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.rm,1); render();});
  el.querySelector('#scanBtn').onclick=()=>el.querySelector('#fileInput').click();
  el.querySelector('#fileInput').onchange=(e)=>{ if(e.target.files[0]) handlePhotoScan(e.target.files[0]); };
}

function openQtySheet(itemId){
  const item = catalog.find(i=>i.id===itemId);
  let variantIdx = 0, qty = 1;
  const {sheet, close} = openSheet('');
  function draw(){
    const v = item.variants[variantIdx];
    sheet.innerHTML = `
      <div class="font-bold text-lg mb-3">${item.icon} ${esc(item.name)}</div>
      ${item.variants.length>1? `
      <div class="scrollx flex gap-2 mb-4">
        ${item.variants.map((vv,i)=>`<button data-v="${i}" class="px-3 py-2 rounded-full text-sm whitespace-nowrap" style="border:1px solid var(--line); ${i===variantIdx?'background:var(--accent);color:white;border-color:var(--accent);':''}">${esc(vv.name)} · ₹${vv.price}</button>`).join('')}
      </div>`:''}
      <div class="flex items-center justify-center gap-6 my-4">
        <button id="dec" class="card" style="width:48px;height:48px;font-size:22px;">−</button>
        <div class="text-center">
          <input id="qtyInput" type="number" step="any" value="${qty}" class="text-center text-2xl font-bold w-24 py-1" />
          <div style="color:var(--sub)" class="text-xs mt-1">${item.unit}${item.stock!=null? ' · '+item.stock+' in stock':''}</div>
        </div>
        <button id="inc" class="card" style="width:48px;height:48px;font-size:22px;">+</button>
      </div>
      <div class="text-center font-semibold mb-4">Line total: ₹${(qty*v.price).toFixed(2)}</div>
      <div class="flex gap-3">
        <button id="cancel" class="flex-1 py-3 rounded-xl card font-semibold">Cancel</button>
        <button id="add" class="flex-1 py-3 rounded-xl font-bold text-white" style="background:var(--accent)">Add</button>
      </div>
    `;
    sheet.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variantIdx=+b.dataset.v; draw();});
    sheet.querySelector('#dec').onclick=()=>{qty=Math.max(0.5, qty-1); draw();};
    sheet.querySelector('#inc').onclick=()=>{qty=qty+1; draw();};
    sheet.querySelector('#qtyInput').oninput=(e)=>{qty=parseFloat(e.target.value)||0;};
    sheet.querySelector('#qtyInput').onchange=()=>draw();
    sheet.querySelector('#cancel').onclick=close;
    sheet.querySelector('#add').onclick=()=>{
      const vv=item.variants[variantIdx];
      const q = qty>0?qty:1;
      cart.push({uid:Date.now()+Math.random(), itemId:item.id, name:item.name, icon:item.icon, variant:vv.name, unit:item.unit, price:vv.price, qty:q});
      close(); render();
    };
  }
  draw();
}

// ---------- AI photo-to-list scan ----------
async function handlePhotoScan(file){
  if(!sampleAPI){
    alert('AI list-scanning needs Claude access for this app, which is not available in this view.');
    return;
  }
  const {sheet, close} = openSheet(`<div class="font-bold text-lg mb-3">📷 Reading list...</div><div style="color:var(--sub)" class="text-sm">Analyzing photo, please wait (a few seconds)...</div>`);
  try{
    const catalogNames = catalog.map(it=>({id:it.id, name:it.name, variants:it.variants.map(v=>v.name)}));
    const prompt = `This image is a handwritten or texted shopping list (or a screenshot of a message). Extract every distinct item requested and an approximate quantity if mentioned (default 1 if not stated). Here is the seller's inventory as JSON: ${JSON.stringify(catalogNames)}. For each extracted item, try to match it to the closest inventory item+variant by name (case-insensitive, allow synonyms/typos). Reply with ONLY a JSON array of objects: {"requested":string, "matchedItemId": string|null, "matchedVariant": string|null, "qty": number}. If no reasonable inventory match exists, set matchedItemId to null.`;
    const result = await sampleAPI.json(prompt, {images:[file], modelTier:'quick'});
    close();
    showScanReview(Array.isArray(result)?result:[]);
  }catch(e){
    close();
    if(e && e.code==='not_granted') alert('You declined Claude access, so photo-scanning is unavailable.');
    else if(e && e.code==='image_rejected') alert('That image could not be read. Try a clearer photo.');
    else alert('Could not read the list right now. Please try again.');
  }
}
function showScanReview(items){
  if(items.length===0){ alert('No items were detected in that photo.'); return; }
  const enriched = items.map(r=>{
    const item = r.matchedItemId? catalog.find(c=>c.id===r.matchedItemId) : null;
    const variant = item? (item.variants.find(v=>v.name===r.matchedVariant)||item.variants[0]) : null;
    return {...r, item, variant};
  });
  const {sheet, close} = openSheet(`
    <div class="font-bold text-lg mb-3">📋 Detected items</div>
    <div class="mb-3">
      ${enriched.map((r,i)=> r.item? `
        <div class="flex items-center justify-between py-2 card px-3 mb-2">
          <div class="text-sm"><input type="checkbox" data-chk="${i}" checked class="mr-2">${r.item.icon} ${esc(r.item.name)} (${esc(r.variant.name)}) <span style="color:var(--sub)">x${r.qty}</span></div>
          <div class="font-semibold text-sm">₹${(r.qty*r.variant.price).toFixed(2)}</div>
        </div>` : `
        <div class="py-2 px-3 mb-2 card" style="color:var(--danger);border-color:var(--danger)">
          ⚠️ "${esc(r.requested)}" — not in inventory
        </div>`
      ).join('')}
    </div>
    <div class="flex gap-3">
      <button id="cancelScan" class="flex-1 py-3 rounded-xl card font-semibold">Cancel</button>
      <button id="addScan" class="flex-1 py-3 rounded-xl font-bold text-white" style="background:var(--accent)">Add matched to bill</button>
    </div>
  `);
  sheet.querySelector('#cancelScan').onclick=close;
  sheet.querySelector('#addScan').onclick=()=>{
    enriched.forEach((r,i)=>{
      const chk = sheet.querySelector(`[data-chk="${i}"]`);
      if(r.item && chk && chk.checked){
        cart.push({uid:Date.now()+Math.random()+i, itemId:r.item.id, name:r.item.name, icon:r.item.icon, variant:r.variant.name, unit:r.item.unit, price:r.variant.price, qty:r.qty||1});
      }
    });
    close(); render();
  };
}

// ---------- Catalog tab ----------
function renderCatalog(el){
  el.innerHTML = `
    <button id="addItem" class="w-full py-3 rounded-xl font-bold text-white mb-4" style="background:var(--accent)">+ Add Item</button>
    ${catalog.map((it,idx)=>`
      <div class="card p-3 mb-2">
        <div class="flex items-center justify-between">
          <div class="font-semibold">${it.icon} ${esc(it.name)} <span style="color:var(--sub)" class="text-xs">(${it.unit})</span></div>
          <div class="flex gap-3">
            <button data-edit="${idx}">✏️</button>
            <button data-del="${idx}" style="color:var(--danger)">🗑️</button>
          </div>
        </div>
        <div style="color:var(--sub)" class="text-xs mt-1">${it.variants.map(v=>v.name+': ₹'+v.price).join(' · ')}</div>
        <div style="color:${it.stock!=null && it.lowStock!=null && it.stock<=it.lowStock?'var(--danger)':'var(--sub)'}" class="text-xs mt-1">${it.stock!=null? 'Stock: '+it.stock+' '+it.unit + (it.lowStock!=null?' (alert below '+it.lowStock+')':'') : 'Stock not tracked'}</div>
      </div>
    `).join('')}
  `;
  el.querySelector('#addItem').onclick=()=>openItemEditor(null);
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openItemEditor(+b.dataset.edit));
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{catalog.splice(+b.dataset.del,1); saveCatalog(catalog); render();});
}

function openItemEditor(idx){
  const isNew = idx===null;
  const item = isNew ? {id:'item'+Date.now(),name:'',icon:'🛒',unit:'pcs',variants:[{name:'Standard',price:0}],stock:null,lowStock:null} : JSON.parse(JSON.stringify(catalog[idx]));
  const {sheet, close} = openSheet('');
  function draw(){
    sheet.innerHTML = `
      <div class="font-bold text-lg mb-3">${isNew?'Add Item':'Edit Item'}</div>
      <div class="flex gap-2 mb-2">
        <input id="icon" value="${esc(item.icon)}" class="w-16 text-center text-xl px-2 py-2" />
        <input id="name" placeholder="Item name" value="${esc(item.name)}" class="flex-1 px-3 py-2" />
      </div>
      <div class="mb-3">
        <label class="text-xs" style="color:var(--sub)">Unit</label>
        <select id="unit" class="w-full px-3 py-2 mt-1">
          <option value="pcs" ${item.unit==='pcs'?'selected':''}>Pieces (pcs)</option>
          <option value="kg" ${item.unit==='kg'?'selected':''}>Kilograms (kg)</option>
          <option value="l" ${item.unit==='l'?'selected':''}>Litres (l)</option>
          <option value="g" ${item.unit==='g'?'selected':''}>Grams (g)</option>
          <option value="plate" ${item.unit==='plate'?'selected':''}>Plate</option>
        </select>
      </div>
      <div class="text-xs mb-1" style="color:var(--sub)">Variants / qualities & price</div>
      <div id="variantsBox" class="mb-2">
        ${item.variants.map((v,i)=>`
          <div class="flex gap-2 mb-2">
            <input data-vn="${i}" value="${esc(v.name)}" placeholder="Variant name" class="flex-1 px-2 py-2 text-sm" />
            <input data-vp="${i}" type="number" value="${v.price}" placeholder="Price" class="w-24 px-2 py-2 text-sm" />
            <button data-vd="${i}" style="color:var(--danger)">✕</button>
          </div>
        `).join('')}
      </div>
      <button id="addVariant" class="text-sm chip px-3 py-1 rounded-full mb-4">+ Add variant</button>
      <div class="flex gap-2 mb-4">
        <div class="flex-1">
          <label class="text-xs" style="color:var(--sub)">Stock qty (optional)</label>
          <input id="stock" type="number" value="${item.stock==null?'':item.stock}" placeholder="Not tracked" class="w-full px-2 py-2 mt-1 text-sm" />
        </div>
        <div class="flex-1">
          <label class="text-xs" style="color:var(--sub)">Low stock alert at</label>
          <input id="lowStock" type="number" value="${item.lowStock==null?'':item.lowStock}" placeholder="e.g. 5" class="w-full px-2 py-2 mt-1 text-sm" />
        </div>
      </div>
      <div class="flex gap-3">
        <button id="cancel" class="flex-1 py-3 rounded-xl card font-semibold">Cancel</button>
        <button id="save" class="flex-1 py-3 rounded-xl font-bold text-white" style="background:var(--accent)">Save</button>
      </div>
    `;
    sheet.querySelector('#icon').oninput=e=>item.icon=e.target.value;
    sheet.querySelector('#name').oninput=e=>item.name=e.target.value;
    sheet.querySelector('#unit').onchange=e=>item.unit=e.target.value;
    sheet.querySelector('#stock').oninput=e=>item.stock = e.target.value===''? null : parseFloat(e.target.value);
    sheet.querySelector('#lowStock').oninput=e=>item.lowStock = e.target.value===''? null : parseFloat(e.target.value);
    sheet.querySelectorAll('[data-vn]').forEach(inp=>inp.oninput=e=>item.variants[+inp.dataset.vn].name=e.target.value);
    sheet.querySelectorAll('[data-vp]').forEach(inp=>inp.oninput=e=>item.variants[+inp.dataset.vp].price=parseFloat(e.target.value)||0);
    sheet.querySelectorAll('[data-vd]').forEach(b=>b.onclick=()=>{item.variants.splice(+b.dataset.vd,1); if(item.variants.length===0)item.variants.push({name:'Standard',price:0}); draw();});
    sheet.querySelector('#addVariant').onclick=()=>{item.variants.push({name:'',price:0}); draw();};
    sheet.querySelector('#cancel').onclick=close;
    sheet.querySelector('#save').onclick=()=>{
      if(!item.name.trim()){ alert('Please enter item name'); return; }
      if(isNew) catalog.push(item); else catalog[idx]=item;
      saveCatalog(catalog); close(); render();
    };
  }
  draw();
}

// ---------- Settings tab ----------
function renderSettings(el){
  el.innerHTML = `
    <div class="card p-4 mb-3">
      <label class="text-xs" style="color:var(--sub)">Shop / Business Name</label>
      <input id="shopName" value="${esc(settings.shopName)}" class="w-full px-3 py-2 mt-1 mb-3" />
      <label class="text-xs" style="color:var(--sub)">Your WhatsApp number (with country code)</label>
      <input id="phone" value="${esc(settings.phone)}" placeholder="e.g. 91XXXXXXXXXX" class="w-full px-3 py-2 mt-1 mb-3" />
      <label class="text-xs" style="color:var(--sub)">Theme</label>
      <select id="theme" class="w-full px-3 py-2 mt-1">
        <option value="system" ${settings.theme==='system'?'selected':''}>System</option>
        <option value="light" ${settings.theme==='light'?'selected':''}>Light</option>
        <option value="dark" ${settings.theme==='dark'?'selected':''}>Dark</option>
      </select>
    </div>

    <div class="card p-4 mb-3">
      <div class="font-semibold mb-2">💳 Payment profiles (UPI / bank)</div>
      <div id="profilesBox"></div>
      <button id="addProfile" class="text-sm chip px-3 py-1 rounded-full mt-2">+ Add payment profile</button>
    </div>

    <div class="card p-4 mb-3">
      <div class="flex items-center justify-between mb-2">
        <div class="font-semibold">🧾 GST billing</div>
        <input id="gstEnabled" type="checkbox" ${settings.gstEnabled?'checked':''} style="width:20px;height:20px;" />
      </div>
      <div id="gstFields" style="display:${settings.gstEnabled?'block':'none'}">
        <label class="text-xs" style="color:var(--sub)">GSTIN</label>
        <input id="gstin" value="${esc(settings.gstin)}" placeholder="22AAAAA0000A1Z5" class="w-full px-3 py-2 mt-1 mb-3" />
        <label class="text-xs" style="color:var(--sub)">GST rate (%)</label>
        <input id="gstRate" type="number" value="${settings.gstRate}" class="w-full px-3 py-2 mt-1" />
      </div>
      ${!settings.gstEnabled? `<div style="color:var(--sub)" class="text-xs">Off — bills are generated without GST details.</div>`:''}
    </div>

    <button id="saveSettings" class="w-full py-3 rounded-xl font-bold text-white mb-3" style="background:var(--accent)">Save Settings</button>
    <div style="color:var(--sub)" class="text-xs text-center px-4">All data is stored only on this device.</div>
  `;
  function drawProfiles(){
    el.querySelector('#profilesBox').innerHTML = settings.paymentProfiles.map((p,i)=>`
      <div class="flex gap-2 mb-2 items-center">
        <input type="radio" name="defProfile" data-def="${i}" ${settings.defaultProfile===i?'checked':''} />
        <input data-pl="${i}" value="${esc(p.label)}" placeholder="Label (e.g. GPay)" class="flex-1 px-2 py-2 text-sm" />
        <input data-pu="${i}" value="${esc(p.upiId)}" placeholder="upi-id@bank" class="flex-1 px-2 py-2 text-sm" />
        <button data-pd="${i}" style="color:var(--danger)">✕</button>
      </div>
    `).join('');
    el.querySelectorAll('[data-def]').forEach(r=>r.onchange=()=>{settings.defaultProfile=+r.dataset.def;});
    el.querySelectorAll('[data-pl]').forEach(inp=>inp.oninput=e=>settings.paymentProfiles[+inp.dataset.pl].label=e.target.value);
    el.querySelectorAll('[data-pu]').forEach(inp=>inp.oninput=e=>settings.paymentProfiles[+inp.dataset.pu].upiId=e.target.value);
    el.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{settings.paymentProfiles.splice(+b.dataset.pd,1); if(settings.paymentProfiles.length===0)settings.paymentProfiles.push({label:'Primary UPI',upiId:''}); drawProfiles();});
  }
  drawProfiles();
  el.querySelector('#addProfile').onclick=()=>{settings.paymentProfiles.push({label:'',upiId:''}); drawProfiles();};
  el.querySelector('#gstEnabled').onchange=(e)=>{settings.gstEnabled=e.target.checked; el.querySelector('#gstFields').style.display=e.target.checked?'block':'none'; el.querySelector('#gstEnabled').closest('.card').querySelector('.text-xs.text-center')?.remove();};
  el.querySelector('#saveSettings').onclick=()=>{
    settings.shopName = el.querySelector('#shopName').value;
    settings.phone = el.querySelector('#phone').value.replace(/\D/g,'');
    settings.theme = el.querySelector('#theme').value;
    if(el.querySelector('#gstin')) settings.gstin = el.querySelector('#gstin').value.trim();
    if(el.querySelector('#gstRate')) settings.gstRate = parseFloat(el.querySelector('#gstRate').value)||0;
    saveSettings(settings); applyTheme(); render();
  };
}

// ---------- Insights tab ----------
function renderInsights(el){
  const now=Date.now();
  const ranges={ 'This week': now-7*24*3600*1000, 'This month': now-30*24*3600*1000, 'All time': 0 };
  window.__insightRange = window.__insightRange || 'This month';
  const since = ranges[window.__insightRange];
  const filtered = txns.filter(t=>t.ts>=since);
  const revenue = filtered.reduce((s,t)=>s+t.total,0);
  const cash = filtered.filter(t=>t.method==='cash').reduce((s,t)=>s+t.paidAmount,0);
  const online = filtered.filter(t=>t.method==='online').reduce((s,t)=>s+t.paidAmount,0);
  const tally={};
  filtered.forEach(t=>t.items.forEach(l=>{ tally[l.name]=(tally[l.name]||0)+l.qty; }));
  const top = Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const low = lowStockItems();
  el.innerHTML = `
    <div class="scrollx flex gap-2 mb-4">
      ${Object.keys(ranges).map(r=>`<button data-r="${r}" class="px-3 py-2 rounded-full text-sm whitespace-nowrap" style="border:1px solid var(--line); ${window.__insightRange===r?'background:var(--accent);color:white;border-color:var(--accent);':''}">${r}</button>`).join('')}
    </div>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="card p-3"><div style="color:var(--sub)" class="text-xs">Revenue</div><div class="font-bold text-lg">₹${revenue.toFixed(2)}</div></div>
      <div class="card p-3"><div style="color:var(--sub)" class="text-xs">Bills</div><div class="font-bold text-lg">${filtered.length}</div></div>
      <div class="card p-3"><div style="color:var(--sub)" class="text-xs">💵 Cash received</div><div class="font-bold text-lg">₹${cash.toFixed(2)}</div></div>
      <div class="card p-3"><div style="color:var(--sub)" class="text-xs">📱 Online received</div><div class="font-bold text-lg">₹${online.toFixed(2)}</div></div>
    </div>
    <div class="card p-3 mb-3">
      <div class="font-semibold mb-2">Top selling items</div>
      ${top.length? top.map(([n,q],i)=>`<div class="flex justify-between text-sm py-1">${i+1}. ${esc(n)}<span style="color:var(--sub)">${q} sold</span></div>`).join('') : `<div style="color:var(--sub)" class="text-sm">No sales in this period</div>`}
    </div>
    <div class="card p-3 mb-3">
      <div class="font-semibold mb-2">Stock alerts</div>
      ${low.length? low.map(i=>`<div class="text-sm py-1" style="color:var(--danger)">⚠️ ${i.icon} ${esc(i.name)} — ${i.stock} ${i.unit} left</div>`).join('') : `<div style="color:var(--sub)" class="text-sm">Nothing low right now</div>`}
    </div>
  `;
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{window.__insightRange=b.dataset.r; renderInsights(el);});
}

// ---------- Bill generation ----------
function generateBill(){
  if(cart.length===0) return;
  const subtotal = cart.reduce((s,l)=>s+l.qty*l.price,0);
  const gstAmt = settings.gstEnabled? subtotal*(settings.gstRate/100) : 0;
  const total = subtotal+gstAmt;
  let profileIdx = settings.defaultProfile||0;
  let method='cash', status='full', paidAmount=total;

  const {sheet, close} = openSheet('');
  function draw(){
    const profile = settings.paymentProfiles[profileIdx] || settings.paymentProfiles[0];
    sheet.innerHTML = `
      <div class="font-bold text-lg mb-2">🧾 Bill — ₹${total.toFixed(2)}</div>
      ${settings.gstEnabled? `<div style="color:var(--sub)" class="text-xs mb-2">Subtotal ₹${subtotal.toFixed(2)} + GST ${settings.gstRate}% (₹${gstAmt.toFixed(2)})</div>`:''}
      ${settings.paymentProfiles.length>1? `
      <div class="scrollx flex gap-2 mb-3">
        ${settings.paymentProfiles.map((p,i)=>`<button data-prof="${i}" class="px-3 py-2 rounded-full text-sm whitespace-nowrap" style="border:1px solid var(--line); ${i===profileIdx?'background:var(--accent);color:white;border-color:var(--accent);':''}">${esc(p.label||'Profile '+(i+1))}</button>`).join('')}
      </div>`:''}
      <div id="qrHolder" class="flex justify-center mb-2"></div>
      <div style="color:var(--sub)" class="text-xs text-center mb-4">${profile && profile.upiId? 'Scan to pay via '+esc(profile.label) : 'Add a UPI ID in Settings to show a payment QR'}</div>

      <div class="mb-3">
        <div class="text-xs mb-1" style="color:var(--sub)">Payment method</div>
        <div class="flex gap-2">
          <button data-method="cash" class="flex-1 py-2 rounded-xl text-sm" style="border:1px solid var(--line);${method==='cash'?'background:var(--accent);color:white;':''}">💵 Cash</button>
          <button data-method="online" class="flex-1 py-2 rounded-xl text-sm" style="border:1px solid var(--line);${method==='online'?'background:var(--accent);color:white;':''}">📱 Online</button>
        </div>
      </div>
      <div class="mb-3">
        <div class="text-xs mb-1" style="color:var(--sub)">Payment status</div>
        <div class="flex gap-2">
          <button data-status="full" class="flex-1 py-2 rounded-xl text-sm" style="border:1px solid var(--line);${status==='full'?'background:var(--accent);color:white;':''}">Full</button>
          <button data-status="partial" class="flex-1 py-2 rounded-xl text-sm" style="border:1px solid var(--line);${status==='partial'?'background:var(--accent);color:white;':''}">Partial</button>
        </div>
      </div>
      ${status==='partial'? `<div class="mb-3"><label class="text-xs" style="color:var(--sub)">Amount received now</label><input id="paidAmt" type="number" value="${paidAmount}" class="w-full px-3 py-2 mt-1" /></div>` : ''}

      <div class="flex flex-col gap-3">
        <button id="dlPdf" class="py-3 rounded-xl font-bold text-white" style="background:var(--accent)">Download / Share PDF</button>
        <button id="waShare" class="py-3 rounded-xl font-semibold card">Share via WhatsApp</button>
        <button id="confirmPay" class="py-3 rounded-xl font-bold text-white" style="background:var(--accent-d)">✅ Confirm Payment & Save</button>
        <button id="closeBtn" class="py-2 text-sm" style="color:var(--sub)">Close without saving</button>
      </div>
    `;
    if(profile && profile.upiId){
      const upi = `upi://pay?pa=${encodeURIComponent(profile.upiId)}&pn=${encodeURIComponent(settings.shopName||'Shop')}&am=${total.toFixed(2)}&cu=INR&tn=${encodeURIComponent('Bill payment')}`;
      new QRCode(sheet.querySelector('#qrHolder'), {text:upi, width:170, height:170});
    }
    sheet.querySelectorAll('[data-prof]').forEach(b=>b.onclick=()=>{profileIdx=+b.dataset.prof; draw();});
    sheet.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{method=b.dataset.method; draw();});
    sheet.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{status=b.dataset.status; if(status==='full')paidAmount=total; draw();});
    const paidInp = sheet.querySelector('#paidAmt'); if(paidInp) paidInp.oninput=e=>paidAmount=parseFloat(e.target.value)||0;
    sheet.querySelector('#closeBtn').onclick=close;
    sheet.querySelector('#dlPdf').onclick=()=>downloadPdf(subtotal,gstAmt,total);
    sheet.querySelector('#waShare').onclick=()=>shareWhatsApp(subtotal,gstAmt,total);
    sheet.querySelector('#confirmPay').onclick=()=>{
      const invoiceNo = settings.gstEnabled? settings.invoiceCounter : null;
      txns.push({id:Date.now(), ts:Date.now(), items:cart.map(l=>({name:l.name,variant:l.variant,qty:l.qty,unit:l.unit,price:l.price})),
        subtotal, gst:gstAmt, total, method, status, paidAmount: status==='full'?total:paidAmount, invoiceNo});
      if(settings.gstEnabled) settings.invoiceCounter++;
      catalog.forEach(it=>{
        cart.filter(l=>l.itemId===it.id).forEach(l=>{ if(it.stock!=null) it.stock = Math.max(0, it.stock-l.qty); });
      });
      saveTxns(txns); saveCatalog(catalog); saveSettings(settings);
      cart=[]; close(); render();
    };
  }
  draw();
}

function buildPdf(subtotal,gstAmt,total){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a5'});
  let y=40;
  doc.setFontSize(18); doc.text(settings.shopName||'My Shop', 40, y); y+=20;
  if(settings.gstEnabled && settings.gstin){ doc.setFontSize(9); doc.setTextColor(100); doc.text('GSTIN: '+settings.gstin, 40, y); y+=14; }
  if(settings.gstEnabled){ doc.setFontSize(9); doc.setTextColor(100); doc.text('Invoice No: INV-'+String(settings.invoiceCounter).padStart(4,'0'), 40, y); y+=14; }
  doc.setFontSize(10); doc.setTextColor(120);
  doc.text('Date: '+new Date().toLocaleString(), 40, y); y+=20;
  doc.setDrawColor(220); doc.line(40,y,doc.internal.pageSize.getWidth()-40,y); y+=20;
  doc.setFontSize(11); doc.setTextColor(30);
  doc.text('Item', 40, y); doc.text('Qty', 220, y); doc.text('Rate', 280, y); doc.text('Amount', 350, y); y+=10;
  doc.line(40,y,doc.internal.pageSize.getWidth()-40,y); y+=16;
  cart.forEach(l=>{
    doc.text(`${l.name} (${l.variant})`, 40, y);
    doc.text(`${l.qty} ${l.unit}`, 220, y);
    doc.text(`₹${l.price}`, 280, y);
    doc.text(`₹${(l.qty*l.price).toFixed(2)}`, 350, y);
    y+=18;
  });
  y+=6; doc.line(40,y,doc.internal.pageSize.getWidth()-40,y); y+=20;
  doc.setFontSize(10); doc.setTextColor(80);
  doc.text('Subtotal:', 260, y); doc.text(`₹${subtotal.toFixed(2)}`, 350, y); y+=16;
  if(settings.gstEnabled){ doc.text(`GST (${settings.gstRate}%):`, 260, y); doc.text(`₹${gstAmt.toFixed(2)}`, 350, y); y+=16; }
  y+=6;
  doc.setFontSize(14); doc.setTextColor(0);
  doc.text('Total:', 260, y); doc.text(`₹${total.toFixed(2)}`, 350, y); y+=30;
  const qrCanvas = document.querySelector('#qrHolder canvas') || document.querySelector('#qrHolder img');
  if(qrCanvas){
    try{
      const dataUrl = qrCanvas.tagName==='CANVAS' ? qrCanvas.toDataURL('image/png') : qrCanvas.src;
      doc.addImage(dataUrl, 'PNG', 40, y, 100, 100);
      doc.setFontSize(9); doc.text('Scan to pay via UPI', 150, y+55);
    }catch(e){}
  }
  return doc;
}

async function offerPdf(blob, filename){
  if(downloadsAPI){
    try{ await downloadsAPI.save({filename, data:blob}); return; }
    catch(e){ if(e && e.code==='declined') return; }
  }
  try{
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ alert('Could not save the file in this view.'); }
}

function downloadPdf(subtotal,gstAmt,total){
  const doc = buildPdf(subtotal,gstAmt,total);
  offerPdf(doc.output('blob'), 'bill.pdf');
}
function shareWhatsApp(subtotal,gstAmt,total){
  const doc = buildPdf(subtotal,gstAmt,total);
  offerPdf(doc.output('blob'), 'bill.pdf');
  const phone = settings.phone || '';
  const lines = cart.map(l=>`${l.name} (${l.variant}) x${l.qty}${l.unit} = ₹${(l.qty*l.price).toFixed(2)}`).join('\n');
  const msg = encodeURIComponent(`${settings.shopName||'My Shop'} — Bill\n\n${lines}\n\nTotal: ₹${total.toFixed(2)}\n\n(PDF saved separately — attach it here)`);
  const url = phone ? `https://wa.me/${phone}?text=${msg}` : `https://wa.me/?text=${msg}`;
  window.open(url, '_blank');
}

render();
</script>
