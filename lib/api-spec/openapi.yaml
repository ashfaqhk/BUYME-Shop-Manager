openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: billing
    description: Bill item extraction
  - name: catalog
    description: Product photo recognition
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /billing/extract-list:
    post:
      operationId: extractBillingList
      tags: [billing]
      summary: Extract bill items from an image or PDF
      description: Reads an uploaded list without saving the document or modifying a bill. Seller confirmation is required before adding items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillListDocument"
      responses:
        "200":
          description: Detected items, which may require correction before billing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillListItems"
        "400":
          description: Invalid or unreadable document
        "413":
          description: File too large
        "429":
          description: Extraction rate limit exceeded
        "502":
          description: Document reading service failed
  /catalog/scan-product:
    post:
      operationId: scanCatalogProduct
      tags: [catalog]
      summary: Suggest product details from an uploaded photo
      description: Reads a product or stock-arrival photo without changing inventory. The seller reviews the suggestions before saving.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPhotoDocument"
      responses:
        "200":
          description: Suggested product fields; null means not visible or not certain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPhotoSuggestions"
        "400":
          description: Invalid or unreadable image
        "429":
          description: Extraction rate limit exceeded
        "502":
          description: Photo reading service failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BillListDocument:
      type: object
      properties:
        document:
          type: string
          description: Base64 data URL for a JPEG, PNG, WebP image, or PDF
        filename:
          type: string
          maxLength: 150
      required: [document, filename]
      additionalProperties: false
    BillListItems:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DetectedBillingItem"
      required: [items]
      additionalProperties: false
    DetectedBillingItem:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit:
          type: [string, "null"]
        variant:
          type: [string, "null"]
        unitPrice:
          type: [number, "null"]
      required: [name, quantity, unit, variant, unitPrice]
      additionalProperties: false
    ProductPhotoDocument:
      type: object
      properties:
        document:
          type: string
          description: Base64 JPEG, PNG or WebP image data URL
        filename:
          type: string
          maxLength: 150
      required: [document, filename]
      additionalProperties: false
    ProductPhotoSuggestions:
      type: object
      properties:
        name:
          type: [string, "null"]
        category:
          type: [string, "null"]
        variant:
          type: [string, "null"]
        unit:
          type: [string, "null"]
        unitPrice:
          type: [number, "null"]
        quantity:
          type: [integer, "null"]
      required: [name, category, variant, unit, unitPrice, quantity]
      additionalProperties: false

