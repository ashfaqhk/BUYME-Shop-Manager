openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: billing
    description: Bill item extraction
  - name: catalog
    description: Product photo recognition
paths:
  /shop/history-refresh:
    post:
      operationId: refreshSavedHistory
      tags: [shop]
      summary: Reconcile changed historical bills already saved on this device
      description: Does not download new out-of-window history. Authenticated assigned-shop membership and enabled access required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedHistoryInput"
      responses:
        "200":
          description: Changed saved records only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedHistoryDocument"
  /shop/images:
    post:
      operationId: syncSellerImage
      tags: [shop]
      summary: Store an uploaded image in the assigned shop's Supabase database
      description: Verified member with enabled access required. Validated JPEG, PNG or WebP bytes, at most 6 MB. Content addressing makes identical-image retries idempotent within a shop.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerImageSyncInput"
      responses:
        "200":
          description: Private shop image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerImageSyncResult"
        "400":
          description: Invalid or oversized image
        "401":
          description: Verified sign-in required
        "403":
          description: Shop access paused
        "404":
          description: No assigned shop
  /shop:
    get:
      operationId: getSellerShop
      tags: [shop]
      summary: Load the verified account's assigned shop and current access
      description: No-store response. Paused accounts receive access metadata without catalog, sales or settings. The company administrator receives a company account without a shop ID.
      responses:
        "200":
          description: Shop or company account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerShopDocument"
        "401":
          description: Verified sign-in required
        "403":
          description: Shop assignment unavailable
    put:
      operationId: saveSellerShop
      tags: [shop]
      summary: Save the device snapshot using optimistic concurrency
      description: Only shop members with enabled access may write. Entitlement and account access cannot be changed by this endpoint. A 409 preserves the cloud copy for client-side three-way reconciliation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerShopSaveInput"
      responses:
        "200":
          description: Acknowledged cloud snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerShopDocument"
        "400":
          description: Invalid snapshot
        "401":
          description: Verified sign-in required
        "403":
          description: Shop access paused
        "404":
          description: Not a member of the requested shop
        "409":
          description: Cloud revision or access changed
  /shop/upgrade-request:
    post:
      operationId: requestSellerFullAccess
      tags: [shop]
      summary: Request company approval for Full access
      description: Records a pending request, never grants Full access. Existing requests and approvals are returned without creating a new request.
      responses:
        "200":
          description: Current shop with request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerShopDocument"
        "401":
          description: Verified sign-in required
        "403":
          description: Shop access paused
        "404":
          description: No assigned shop
        "409":
          description: Access changed
  /shop/sellers:
    get:
      operationId: listCompanySellerAccess
      tags: [shop]
      summary: List existing shops, member emails and access for the company administrator
      responses:
        "200":
          description: No-store seller access list
          content:
            application/json:
              schema:
                type: object
                required: [sellers]
                properties:
                  sellers:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanySellerDocument"
        "403":
          description: Verified company administrator email required
  /shop/sellers/{id}:
    patch:
      operationId: updateCompanySellerAccess
      tags: [shop]
      summary: Approve or downgrade a shop plan, or pause or restore its access
      description: Company administrator only. Changes apply to all shop members. Existing data is retained and the revision increases.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyAccessPatchInput"
      responses:
        "200":
          description: Updated access metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopAccessDocument"
        "400":
          description: Choose a plan or access change
        "403":
          description: Verified company administrator email required
        "404":
          description: Shop not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /billing/extract-list:
    post:
      operationId: extractBillingList
      tags: [billing]
      summary: Extract bill items from an image or PDF
      description: Reads an uploaded list without saving the document or modifying a bill. Seller confirmation is required before adding items. Shares a global limit of 8 attempts per UTC day and 40 per UTC month with catalog scans; retries count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillListDocument"
      responses:
        "200":
          description: Detected items, which may require correction before billing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillListItems"
        "400":
          description: Invalid or unreadable document
        "413":
          description: File too large
        "429":
          description: Shared AI scan budget exhausted
        "503":
          description: AI scanning or budget storage unavailable
        "502":
          description: Document reading service failed
  /catalog/scan-product:
    post:
      operationId: scanCatalogProduct
      tags: [catalog]
      summary: Suggest product details from an uploaded photo
      description: Reads a product or stock-arrival photo without changing inventory. The seller reviews the suggestions before saving. Shares a global limit of 8 attempts per UTC day and 40 per UTC month with billing scans; retries count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPhotoDocument"
      responses:
        "200":
          description: Suggested product fields; null means not visible or not certain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPhotoSuggestions"
        "400":
          description: Invalid or unreadable image
        "429":
          description: Shared AI scan budget exhausted
        "503":
          description: AI scanning or budget storage unavailable
        "502":
          description: Photo reading service failed
components:
  schemas:
    SellerImageSyncInput:
      type: object
      required: [contentType, base64]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        base64:
          type: string
          minLength: 4
          maxLength: 8000000
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
    SellerImageSyncResult:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
    CompanyAccessPatchInput:
      type: object
      minProperties: 1
      properties:
        premiumApproved:
          type: boolean
        accessEnabled:
          type: boolean
    SellerShopSaveInput:
      type: object
      required: [catalog, sales, settings, revision]
      properties:
        shopId:
          type: string
          description: New clients provide their exact assigned shop ID; optional for existing clients.
        catalog:
          type: array
          maxItems: 5000
          items: {}
        sales:
          type: array
          maxItems: 100000
          items: {}
        settings:
          type: object
          additionalProperties: true
        revision:
          type: integer
          minimum: 1
    SellerShopDocument:
      type: object
      required: [shopId, shopName, email, role, isCompanyAdmin, premiumApproved, accessEnabled, upgradeRequestedAt, mode, catalog, sales, settings, revision]
      properties:
        historyStart:
          type: string
          format: date-time
        historyMonths:
          type: integer
          enum: [2, 24]
        shopId:
          type: [string, "null"]
        shopName:
          type: string
        email:
          type: string
        role:
          type: string
        isCompanyAdmin:
          type: boolean
        premiumApproved:
          type: boolean
        accessEnabled:
          type: boolean
        upgradeRequestedAt:
          type: [string, "null"]
          format: date-time
        mode:
          type: string
          enum: [basic, full]
        catalog:
          type: array
          items: {}
        sales:
          type: array
          items: {}
        settings:
          type: object
          additionalProperties: true
        revision:
          type: integer
        isNew:
          type: boolean
    ShopAccessDocument:
      description: Uploads retain all history. New downloads include the last 2 calendar months for Basic or 24 months for Premium, plus unpaid bills and recent collections.
      type: object
      required: [id, premiumApproved, accessEnabled, upgradeRequestedAt]
      properties:
        id:
          type: string
        premiumApproved:
          type: boolean
        accessEnabled:
          type: boolean
        upgradeRequestedAt:
          type: [string, "null"]
          format: date-time
    SavedHistoryInput:
      type: object
      required: [records, revision]
      properties:
        revision:
          type: integer
          minimum: 1
        records:
          type: array
          maxItems: 100000
          items:
            $ref: "#/components/schemas/SavedHistoryFingerprint"
    SavedHistoryFingerprint:
      type: object
      required: [id, fingerprint]
      properties:
        id:
          type: string
          maxLength: 200
        fingerprint:
          type: string
          minLength: 64
          maxLength: 64
    SavedHistoryDocument:
      type: object
      required: [sales]
      properties:
        sales:
          type: array
          items: {}
    CompanySellerDocument:
      allOf:
        - $ref: "#/components/schemas/ShopAccessDocument"
        - type: object
          required: [name, members]
          properties:
            name:
              type: string
            members:
              type: array
              items:
                type: object
                required: [email, role]
                properties:
                  email:
                    type: string
                  role:
                    type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BillListDocument:
      type: object
      properties:
        document:
          type: string
          description: Base64 data URL for a JPEG, PNG, WebP image, or PDF
        filename:
          type: string
          maxLength: 150
      required: [document, filename]
      additionalProperties: false
    BillListItems:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DetectedBillingItem"
      required: [items]
      additionalProperties: false
    DetectedBillingItem:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit:
          type: [string, "null"]
        variant:
          type: [string, "null"]
        unitPrice:
          type: [number, "null"]
      required: [name, quantity, unit, variant, unitPrice]
      additionalProperties: false
    ProductPhotoDocument:
      type: object
      properties:
        document:
          type: string
          description: Base64 JPEG, PNG or WebP image data URL
        filename:
          type: string
          maxLength: 150
      required: [document, filename]
      additionalProperties: false
    ProductPhotoSuggestions:
      type: object
      properties:
        name:
          type: [string, "null"]
        category:
          type: [string, "null"]
        variant:
          type: [string, "null"]
        unit:
          type: [string, "null"]
        unitPrice:
          type: [number, "null"]
        quantity:
          type: [integer, "null"]
      required: [name, category, variant, unit, unitPrice, quantity]
      additionalProperties: false

